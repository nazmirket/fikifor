name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fikifor
          POSTGRES_PASSWORD: fikifor
          POSTGRES_DB: fikifor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fikifor -d fikifor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fikifor:fikifor@localhost:5432/fikifor_test
      TEST_DATABASE_URL: postgresql://fikifor:fikifor@localhost:5432/fikifor_test
      JWT_SECRET: ci-secret-that-is-long-enough-for-fikifor
      CORS_ORIGINS: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:build
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: docker build --file apps/api/Dockerfile --tag fikifor-api:ci .
      - run: docker build --file apps/web/Dockerfile --tag fikifor-web:ci .
