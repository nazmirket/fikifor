name: ${COMPOSE_PROJECT_NAME:-fikifor}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '${LOG_MAX_SIZE:-20m}'
    max-file: '${LOG_MAX_FILES:-5}'

x-api-environment: &api-environment
  NODE_ENV: production
  DEFAULT_PORT: '3001'
  SOCKET_PORT: '3002'
  JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  REMOTE_IMAGE_MAX_BYTES: ${REMOTE_IMAGE_MAX_BYTES:-5000000}
  REMOTE_IMAGE_TIMEOUT_MS: ${REMOTE_IMAGE_TIMEOUT_MS:-8000}
  GAME_COUNTDOWN_MS: ${GAME_COUNTDOWN_MS:-5000}
  MATCH_DEADLINE_MS: ${MATCH_DEADLINE_MS:-60000}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
  DATABASE_URL: postgresql://${DB_USER:-fikifor}:${DB_PASSWORD:-fikifor}@postgres:5432/${DB_NAME:-fikifor}

x-api-service: &api-service
  image: fikifor-api:${FIKIFOR_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: *api-environment
  logging: *default-logging
  networks:
    - app
    - data

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:-fikifor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fikifor}
      POSTGRES_DB: ${DB_NAME:-fikifor}
    ports:
      - '127.0.0.1:${BIND_DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${BIND_REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - data

  migrate:
    <<: *api-service
    restart: 'no'
    command: ['/app/node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-service
    restart: unless-stopped
    command: ['node', 'build/server.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${BIND_API_PORT:-3001}:3001'
    volumes:
      - uploads:/app/apps/api/files
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  socket:
    <<: *api-service
    restart: unless-stopped
    command: ['node', 'build/ws/server.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BIND_SOCKET_PORT:-3002}:3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    image: fikifor-web:${FIKIFOR_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      NUXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      NUXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NUXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:3002}
    depends_on:
      api:
        condition: service_healthy
      socket:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BIND_WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

networks:
  app:
    driver: bridge
  data:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
